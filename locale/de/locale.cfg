[item-description]
crust_extractor=Ein kleiner, hungriger Miner, der dir 45 Items je Sekunde serviert. Ausreichend, für die blauen Transportbänder.
moho_extractor=Der mittlere Bruder des kleinen Miners, mit noch mehr Hunger. Er serviert dir mit 90 Items je Sekunde. Grüne Transportbänder kommen solo nicht hinterher.
mantle_extractor=Der große Bruder unter den drei Minern, welcher dir 180 Items je Sekunde serviert. Da laufen selbst gemoddete Transportbänder heiß.

