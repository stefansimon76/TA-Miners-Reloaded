[technology-description]
crust_extractor=Mit diesem Miner, kannst du Erzfelder schneller abbauen, als mit 90 elektrischen Minern.
moho_extractor=Größerer Abbaubereich und schneller als sein Vorgänger. Ersetzt bis zu 180 elektrische Miner und futtert das Erzfeld zum Frühstück.
mantle_extractor=Man nehme 360 elektrische Miner und kombiniere diese zu dem größten, experimentellen Mantle Extractor, dessen hunger auf Erzfelder keine Grenzen kennt.

